name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Set icon path
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then echo "ICON_PATH=assets/icon.ico" >> "$GITHUB_ENV"; fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then echo "ICON_PATH=assets/icon.icns" >> "$GITHUB_ENV"; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then echo "ICON_PATH=assets/icon.png" >> "$GITHUB_ENV"; fi

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean --windowed --onefile --name "Playground Mods" --icon "$ICON_PATH" --collect-all PySide6 main.py

      - name: Package archive
        run: >
          python -c "import shutil, sys; name = 'Playground Mods.app' if sys.platform == 'darwin' else ('Playground Mods.exe' if sys.platform == 'win32' else 'Playground Mods'); shutil.make_archive('dist/Playground-Mods-' + sys.platform, 'zip', 'dist', name)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playground-Mods-${{ matrix.os }}
          path: dist/*.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false