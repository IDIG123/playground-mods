name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            icon: assets/icon.png
            artifact_path: dist/Playground Mods
          - os: windows-latest
            icon: assets/icon.ico
            artifact_path: dist/Playground Mods.exe
          - os: macos-latest
            icon: assets/icon.icns
            artifact_path: dist/Playground-Mods-darwin.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean --windowed --onefile --name "Playground Mods" --icon "${{ matrix.icon }}" --collect-all PySide6 main.py

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: python -c "import shutil; shutil.make_archive('dist/Playground-Mods-darwin', 'zip', 'dist', 'Playground Mods.app')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playground-Mods-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false